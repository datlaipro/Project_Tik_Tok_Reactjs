# Redirect non-www -> www
server {
  listen 80;
  server_name tiktok.io.vn;
  return 301 http://www.tiktok.io.vn$request_uri;
}

# FE: www.tiktok.io.vn -> tikweb (container FE)
server {
  listen 80;
  server_name www.tiktok.io.vn;

  client_max_body_size 50m;

  location / {
    proxy_pass http://tikweb:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# BE: api.tiktok.io.vn -> tikapi (container BE)
server {
  listen 80;
  server_name api.tiktok.io.vn;

  client_max_body_size 100m;

  # hỗ trợ websocket nếu cần
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  location / {
    proxy_pass http://tikapi:4000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
  }
}
