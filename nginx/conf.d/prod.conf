# ---------- WebSocket helper ----------
# (File trong conf.d/* sẽ được include bên trong khối http{} của Nginx mặc định)
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# ---------- HTTP: ACME + redirect HTTPS ----------
server {
  listen 80;
  server_name tiktok.io.vn www.tiktok.io.vn app.tiktok.io.vn api.tiktok.io.vn;

  # Cho Certbot xác thực qua webroot
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  # Redirect tất cả còn lại lên HTTPS (giữ nguyên host & path)
  location / {
    return 301 https://$host$request_uri;
  }
}

# ---------- HTTPS: FE + API cùng origin ----------
server {
  listen 443 ssl;
  http2 on;
  server_name tiktok.io.vn www.tiktok.io.vn app.tiktok.io.vn;

  # Chứng chỉ (đã cấp cho tiktok.io.vn)
  ssl_certificate     /etc/letsencrypt/live/tiktok.io.vn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tiktok.io.vn/privkey.pem;

  # TLS cơ bản (không cần include options-ssl)
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Bật sau khi đã dùng HTTPS cho toàn bộ site
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 100m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  gzip_min_length 1024;

  # Docker DNS để resolve service name (api/web)
  resolver 127.0.0.11 ipv6=off valid=30s;

  # ---------- API: /api/* -> service api:4000 ----------
  # Backend KHÔNG có prefix /api, nên dùng dấu "/" cuối trong proxy_pass để STRIP "/api"
  location /api/ {
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_pass http://api:4000/;   # <— quan trọng: giữ dấu "/" cuối để strip /api
    proxy_redirect off;

    proxy_read_timeout 180s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 5s;

    # (tuỳ chọn) tắt cache cho API
    add_header Cache-Control "no-store" always;
  }

  # ---------- FE (SPA): proxy tới web + fallback index.html khi 404 (fix F5 ở route con) ----------
  location / {
    proxy_intercept_errors on;
    error_page 404 = /__spa_index__;
    proxy_pass http://web:80;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 120s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 5s;
  }

  # Fallback trả index.html từ upstream
  # (dùng exact location =, KHÔNG dùng named @ để hợp lệ với proxy_pass có URI)
  location = /__spa_index__ {
    internal;
    proxy_pass http://web:80/index.html;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

