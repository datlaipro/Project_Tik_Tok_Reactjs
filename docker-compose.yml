version: "3.9"

services:
  db:
    image: mysql:5.7
    container_name: tikdb
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: video_platform
    volumes:
      - db_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3306"   # mở ra ngoài nếu cần quản trị
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tikredis
    command: ["redis-server", "--appendonly", "yes", "--protected-mode", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: ./Tik_Tok_Express
    image: babyshark1000/project_tik_tok_clone-api:latest
    container_name: tikapi
    env_file:
      - ./Tik_Tok_Express/.env
    environment:
      NODE_ENV: production
      DB_HOST: db
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # DB_USER, DB_PASSWORD... -> để trong .env nếu cần
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "4000"      # chỉ nội bộ; Nginx reverse proxy vào
    restart: unless-stopped

  web:
    build:
      context: ./tik-tok
      args:
        # Dùng /api để FE gọi cùng origin qua Nginx khi test localhost
        REACT_APP_URL_API_PUBLIC: "/api"
    image: babyshark1000/project_tik_tok_clone-web:latest
    container_name: tikweb
    env_file:
      - ./tik-tok/.env
    depends_on:
      - api
    expose:
      - "80"        # FE serve port 80 nội bộ; Nginx reverse proxy vào
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: tiknginx
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"   # dùng cho prod; local vẫn map được, chỉ cần cấu hình server phù hợp
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/logs:/var/log/nginx
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
      - /etc/letsencrypt:/etc/letsencrypt
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: tikcertbot
    profiles: ["prod"]  # chỉ chạy ở môi trường production
    volumes:
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet --deploy-hook 'nginx -s reload';
        sleep 12h;
      done"

volumes:
  db_data:
  redis_data:
